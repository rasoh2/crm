version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: crm-ai-db
    environment:
      POSTGRES_DB: crm_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/seed/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/src/seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend - Node.js + Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-ai-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/crm_ai
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  # Frontend - React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
